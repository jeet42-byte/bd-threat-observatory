name: Posture scan

# Passive security-posture assessment of monitored org domains. Runs on GitHub
# Actions (open outbound network + DNS). Daily is plenty for posture drift.
on:
  schedule:
    - cron: "30 3 * * *"   # daily 03:30 UTC
  workflow_dispatch:

concurrency:
  group: posture
  cancel-in-progress: false

jobs:
  posture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run posture scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENVIRONMENT: production
        run: python -m app.posture.run_posture
